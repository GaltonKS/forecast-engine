# Every resource is in Ohio: close to the Pilot apps on Fly (Chicago, "ord"),
# and on one private network. Render can't move a resource to another region
# after it's created, so change this only before the first Blueprint sync.
databases:
  - name: forecast-db
    plan: basic-256mb
    region: ohio

services:
  - type: web
    name: forecast-api
    runtime: python
    region: ohio
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: forecast-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: forecast-queue
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # your frontend's URL(s), comma-separated
      # LLM endpoint for /query (step 5). Leave empty until the model is
      # deployed; /query answers 503 "not configured" until then.
      - key: LLM_BASE_URL
        sync: false # e.g. https://<you>--vllm-serve.modal.run/v1
      - key: LLM_MODEL
        sync: false # the model name vLLM serves, e.g. Qwen/Qwen2.5-7B-Instruct
      - key: LLM_API_KEY
        sync: false

  # Runs forecast and scenario jobs from the queue. Plan left at Render's
  # default worker size (0.5 CPU / 512 MB); one job at a time.
  - type: worker
    name: forecast-worker
    runtime: python
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.worker worker --concurrency 1 --loglevel INFO
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: forecast-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: forecast-queue
          property: connectionString
      # LLM endpoint for /query (step 5). Leave empty until the model is
      # deployed; /query answers 503 "not configured" until then.
      - key: LLM_BASE_URL
        sync: false # e.g. https://<you>--vllm-serve.modal.run/v1
      - key: LLM_MODEL
        sync: false # the model name vLLM serves, e.g. Qwen/Qwen2.5-7B-Instruct
      - key: LLM_API_KEY
        sync: false

  # Valkey job queue. noeviction: a full queue rejects new jobs rather than
  # silently dropping queued ones. Paid plans persist to disk; the free plan
  # does not, so queued jobs would be lost on restart.
  - type: keyvalue
    name: forecast-queue
    region: ohio
    ipAllowList: [] # private network only
    maxmemoryPolicy: noeviction
